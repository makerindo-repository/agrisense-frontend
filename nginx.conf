user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # Upstream
    upstream app {
        server app:9000;
    }

    # HTTP redirect to HTTPS
    server {
        listen 80;
        server_name _;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Legacy IoT devices are deployed with the HTTP IP endpoint:
        # http://103.186.1.108/api/iot/agrisense/readings
        # Keep this ingestion path on port 80 so those devices do not get
        # redirected to HTTPS by IP, which fails certificate validation.
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            fastcgi_pass app;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /app/backend/public/index.php;
            include fastcgi_params;

            fastcgi_read_timeout 60s;
        }
        
        location /storage/ {
            alias /app/public/storage/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # SSL certificates
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Root
        root /app/dist;
        index index.html;

        # Frontend (React SPA)
        # Use @fallback to break the internal redirect cycle.
        # Without this, /index.html re-enters "location /" → try_files loops → 500.
        location / {
            try_files $uri $uri/ @fallback;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Named fallback: serves index.html directly without re-entering try_files
        location @fallback {
            rewrite ^ /index.html break;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        location /storage/ {
            alias /app/public/storage/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Frontend assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # API
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            fastcgi_pass app;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /app/backend/public/index.php;
            include fastcgi_params;
            
            # Timeouts
            fastcgi_read_timeout 60s;
        }

        # Login endpoint (stricter rate limit)
        location /api/login {
            limit_req zone=login_limit burst=5 nodelay;
            
            fastcgi_pass app;
            fastcgi_param SCRIPT_FILENAME /app/backend/public/index.php;
            include fastcgi_params;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Deny access to sensitive files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
